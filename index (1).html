*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--c:#00ddff;--line:rgba(0,170,255,.8);--glow:0 0 15px rgba(0,170,255,.5),0 0 30px rgba(0,100,255,.15);--err:#ff6666;--ok:#00ff88;}
html,body{height:100%;}
body{
	font-family:'Droid Arabic Kufi',Tahoma,'Segoe UI',Arial,sans-serif;
	color:var(--c);
	background:radial-gradient(ellipse at 50% -10%,#08306a 0%,#041733 45%,#020b1c 100%) fixed;
	min-height:100vh;min-height:100dvh;
	display:flex;align-items:center;justify-content:center;
	padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
	overflow-x:hidden;
}
body::before{
	content:"";position:fixed;inset:0;pointer-events:none;
	background-image:linear-gradient(rgba(0,170,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,170,255,.06) 1px,transparent 1px);
	background-size:38px 38px;
	-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
	mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
}
.wrap{position:relative;width:100%;max-width:360px;text-align:center;}
.brand{font-family:Arial,sans-serif;font-weight:bold;font-size:1.7em;letter-spacing:9px;padding-inline-start:9px;color:var(--c);text-shadow:0 0 12px rgba(0,200,255,.9),0 0 28px rgba(0,120,255,.5);}
.sub{font-family:Arial,sans-serif;font-size:.62em;letter-spacing:4px;color:rgba(0,200,255,.55);margin-top:2px;}
h1{font-size:.95em;margin:14px 0 12px;text-shadow:0 0 8px rgba(0,200,255,.7);}
.view{
	position:relative;width:100%;height:0;padding-bottom:100%;
	border-radius:8px;overflow:hidden;background:#000;
	border:1px solid rgba(0,170,255,.6);
	box-shadow:0 0 18px rgba(0,170,255,.45),inset 0 0 12px rgba(0,170,255,.15);
}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.corner{position:absolute;width:30px;height:30px;border:0 solid var(--c);filter:drop-shadow(0 0 5px var(--c));transition:border-color .25s,filter .25s;}
.corner.tl{top:13%;right:13%;border-width:3px 3px 0 0;border-top-right-radius:7px;}
.corner.tr{top:13%;left:13%;border-width:3px 0 0 3px;border-top-left-radius:7px;}
.corner.bl{bottom:13%;right:13%;border-width:0 3px 3px 0;border-bottom-right-radius:7px;}
.corner.br{bottom:13%;left:13%;border-width:0 0 3px 3px;border-bottom-left-radius:7px;}
.line{position:absolute;left:13%;right:13%;top:13%;height:2px;background:var(--c);box-shadow:0 0 10px var(--c),0 0 22px rgba(0,200,255,.7);animation:scan 2.2s ease-in-out infinite;}
@keyframes scan{0%,100%{top:13%}50%{top:87%}}
.view.ok .corner{border-color:var(--ok);filter:drop-shadow(0 0 6px var(--ok));}
.view.ok .line,.view.err .line,.view.idle .line{display:none;}
.view.err .corner{border-color:var(--err);filter:drop-shadow(0 0 6px var(--err));}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;background:rgba(0,8,22,.78);font-size:.8em;line-height:1.9;}
.view.idle .ov,.view.ok .ov,.view.err .ov{display:flex;}
.ov .big{font-size:3em;line-height:1;}
.view.ok .big{color:var(--ok);text-shadow:0 0 16px rgba(0,255,136,.9);animation:pop .4s ease;}
.view.err .big{color:var(--err);text-shadow:0 0 14px rgba(255,60,60,.8);}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.35);opacity:1}100%{transform:scale(1)}}
.view.ok .ov .txt{color:var(--ok);}
.view.err .ov .txt{color:var(--err);}
.spin{width:34px;height:34px;border:3px solid rgba(0,170,255,.25);border-top-color:var(--c);border-radius:50%;animation:rot .9s linear infinite;}
.view:not(.idle) .spin{display:none;}
@keyframes rot{to{transform:rotate(360deg)}}
.status{min-height:2.6em;margin:11px 0 4px;font-size:.72em;line-height:1.8;color:rgba(0,210,255,.8);text-shadow:0 0 8px rgba(0,190,255,.5);}
.status.err{color:var(--err);text-shadow:0 0 8px rgba(255,60,60,.6);}
.row{display:flex;gap:9px;margin-top:8px;}
.row>*{flex:1;}
.btn{
	display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
	border:1px solid var(--line);outline:none;border-radius:6px;
	font-family:inherit;font-size:.82em;font-weight:bold;padding:11px 8px;
	background:rgba(0,60,160,.35);color:var(--c);cursor:pointer;text-decoration:none;
	text-shadow:0 0 10px rgba(0,200,255,1);box-shadow:var(--glow);
	backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
	transition:all .3s ease;white-space:nowrap;
}
.btn:hover,.btn:active{background:rgba(0,100,200,.5);box-shadow:0 0 25px rgba(0,200,255,.8);}
.btn[hidden]{display:none;}
.btn.on{background:rgba(255,200,0,.22);border-color:rgba(255,210,60,.9);color:#ffd84d;text-shadow:0 0 10px rgba(255,210,60,.9);box-shadow:0 0 18px rgba(255,200,0,.45);}
.btn.ghost{background:rgba(0,10,30,.25);margin-top:9px;}
.ico{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(0,200,255,.9));}
.foot{margin-top:16px;font-family:Arial,sans-serif;font-size:.6em;letter-spacing:2px;color:rgba(0,200,255,.45);}
noscript{display:block;margin-top:14px;color:var(--err);font-size:.8em;}
canvas{display:none;}
</style>
</head>
<body>
<main class="wrap">
	<div class="brand">SKYNET</div>
	<div class="sub">ALRSHEED GROUP</div>
	<h1>وجّه الكاميرا نحو رمز QR على الكرت</h1>

	<div class="view idle" id="view">
		<video id="v" playsinline muted autoplay></video>
		<span class="corner tl"></span><span class="corner tr"></span>
		<span class="corner bl"></span><span class="corner br"></span>
		<span class="line"></span>
		<div class="ov" id="ov"><div class="spin"></div><div class="big" id="big"></div><div class="txt" id="txt">جاري تشغيل الكاميرا ...</div></div>
	</div>

	<div class="status" id="st" role="status" aria-live="polite"></div>

	<div class="row">
		<button type="button" class="btn" id="torch" hidden>
			<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>الفلاش</span>
		</button>
		<button type="button" class="btn" id="photo">
			<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.4"/></svg><span>التقاط صورة</span>
		</button>
	</div>
	<button type="button" class="btn ghost" id="retry" hidden>إعادة المحاولة</button>
	<a class="btn ghost" id="chrome" hidden>فتح في Chrome</a>
	<a class="btn ghost" id="back" href="#">رجوع لصفحة الدخول</a>
	<input type="file" id="file" accept="image/*" capture="environment" hidden>
	<noscript>يلزم تفعيل JavaScript لاستخدام الماسح.</noscript>
	<div class="foot">SKYNET QR LOGIN</div>
</main>
<canvas id="cv"></canvas>

				c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
				x.drawImage(img, 0, 0, c.width, c.height);
				var d = x.getImageData(0, 0, c.width, c.height);
				res = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
			}
			if (res && res.data) { status(''); handle(res.data); }
			else status('لم يتم العثور على رمز QR في الصورة، أعد المحاولة', true);
		};
		img.src = url;
	});

	$('retry').addEventListener('click', start);
	window.addEventListener('pagehide', stopCamera);
	document.addEventListener('visibilitychange', function () { if (document.hidden) stopCamera(); else if (!done && !stream) start(); });
	if (isAndroid && isWebView) showChromeBtn();
	start();
})();
</script>
</body>
